[versions]
kotlin = "2.4.10"
compose = "1.11.1"
serialization = "1.11.0"
coroutines = "1.11.0"
agp = "8.13.2"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.9.4"
androidx-work = "2.11.2"
androidx-core = "1.16.0"
androidx-exifinterface = "1.4.2"
androidx-test = "1.7.0"
androidx-test-junit = "1.3.0"
androidx-test-uiautomator = "2.4.0"
okhttp = "5.4.0"
json = "20250517"
media3 = "1.11.0"
libvlc = "3.7.5"
javafx = "21.0.12"
jse = "1.1.0"
sqlite = "2.7.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidx-exifinterface" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-test-uiautomator" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
org-json = { module = "org.json:json", version.ref = "json" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
videolan-libvlc = { module = "org.videolan.android:libvlc-all", version.ref = "libvlc" }
jse-spi-flac = { module = "io.github.jseproject:jse-spi-flac", version.ref = "jse" }
jse-spi-vorbis = { module = "io.github.jseproject:jse-spi-vorbis", version.ref = "jse" }
jse-spi-opus = { module = "io.github.jseproject:jse-spi-opus", version.ref = "jse" }
jse-spi-mp3 = { module = "io.github.jseproject:jse-spi-mp3", version.ref = "jse" }
jse-spi-aac = { module = "io.github.jseproject:jse-spi-aac", version.ref = "jse" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
