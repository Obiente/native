[package]
name = "nextcloud-native-runtime"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "A typed semantic compiler for adaptive native Nextcloud clients"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"

[dev-dependencies]
pretty_assertions = "1.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Security_Cryptography",
    "Storage",
    "Storage_Provider",
    "Storage_Search",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_WinRT",
] }
windows-future = { version = "0.3.2", features = ["std"] }
