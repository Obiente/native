server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /screenshots/capture-manifest.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /indexnow-deployment.txt {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Preserve the original mixed-platform guide URLs after the platform split.
    location = /guides/getting-started/ { return 301 /guides/; }
    location = /guides/folder-sync/ { return 301 /guides/; }
    location = /guides/calendar/ { return 301 /guides/; }
    location = /guides/offline-files/ { return 301 /guides/android/offline-files/; }
    location = /guides/photo-backup/ { return 301 /guides/android/photo-backup/; }
    location = /guides/switch-apps/ { return 301 /guides/desktop/switch-apps/; }

    location ~* \.(?:png|svg|ico|webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
