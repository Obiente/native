<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const preferences = ["system", "light", "dark"];
        let preference = "system";
        try {
          const saved = window.localStorage.getItem("nextcloud-native-theme");
          if (preferences.includes(saved)) preference = saved;
        } catch {
          preference = "system";
        }
        const system = window.matchMedia("(prefers-color-scheme: light)").matches
          ? "light"
          : "dark";
        const resolved = preference === "system" ? system : preference;
        window.__NEXTCLOUD_NATIVE_THEME__ = { preference, system, resolved };
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <!--app-head-start-->
    <meta name="description" content="One genuinely native client for your complete Nextcloud account, with files, photos, conversations, calendars, installed apps, offline work, and sync." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nextcloud Native" />
    <meta property="og:description" content="Your files, photos, conversations, calendars, and installed Nextcloud apps in one coherent native experience." />
    <title>Nextcloud Native · Obiente</title>
    <!--app-head-end-->
    <meta name="theme-color" content="#0D0F13" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <!--app-state-->
    <script type="module" src="/src/entry-client.js"></script>
  </body>
</html>
