<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const preferences = ["system", "light", "dark"];
        let preference = "system";
        try {
          const saved = window.localStorage.getItem("nextcloud-native-theme");
          if (preferences.includes(saved)) preference = saved;
        } catch {
          preference = "system";
        }
        const system = window.matchMedia("(prefers-color-scheme: light)").matches
          ? "light"
          : "dark";
        const resolved = preference === "system" ? system : preference;
        window.__NEXTCLOUD_NATIVE_THEME__ = { preference, system, resolved };
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <!--app-head-start-->
    <meta name="description" content="Open-source native Nextcloud alpha for Android, Linux, and Windows. Test Files, Photos, Talk history, Calendar, offline files, sync, and installed-app views." />
