<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img">
  <title>Nextcloud Native adaptive architecture</title>
  <desc>Verified server evidence flows through validated typed resources and reusable semantic models into platform-adapted native interfaces.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#24324a"/>
    </linearGradient>
    <linearGradient id="evidence" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c1a3"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="native" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5ce5"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1400" height="620" rx="36" fill="url(#background)"/>
  <circle cx="1280" cy="70" r="180" fill="#7c5ce5" opacity="0.08"/>
  <circle cx="90" cy="580" r="210" fill="#22c1a3" opacity="0.07"/>

  <text x="70" y="72" fill="#f8fafc" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="34" font-weight="700">Evidence becomes native behavior</text>
  <text x="70" y="108" fill="#aebbd0" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="18">Each boundary narrows what the client is allowed to infer and execute.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="165" width="275" height="335" rx="24" fill="#172235" stroke="#35506f"/>
    <rect x="70" y="165" width="275" height="10" rx="5" fill="url(#evidence)"/>
    <text x="100" y="220" fill="#5eead4" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="2">VERIFIED EVIDENCE</text>
    <text x="100" y="264" fill="#f8fafc" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="24" font-weight="700">Server truth</text>
    <text x="100" y="312" fill="#cbd5e1" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="17">Capabilities and versions</text>
    <text x="100" y="352" fill="#cbd5e1" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="17">OCS, DAV and OpenAPI</text>
    <text x="100" y="392" fill="#cbd5e1" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="17">Signed App Store packages</text>
    <text x="100" y="432" fill="#cbd5e1" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="17">Approved read observations</text>
    <rect x="100" y="460" width="162" height="4" rx="2" fill="#22c1a3" opacity="0.7"/>
  </g>

  <path d="M 365 332 H 427" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="445" y="165" width="285" height="335" rx="24" fill="#172235" stroke="#35506f"/>
    <text x="475" y="220" fill="#9fb0c8" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="2">VALIDATED CONTRACT</text>
    <text x="475" y="264" fill="#f8fafc" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="24" font-weight="700">Typed resources</text>
    <text x="475" y="312" fill="#cbd5e1" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="17">Identity and relationships</text>
    <text x="475" y="352" fill="#cbd5e1" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="17">Permissions and actions</text>
    <text x="475" y="392" fill="#cbd5e1" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="17">Versions and provenance</text>
    <text x="475" y="432" fill="#cbd5e1" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="17">Failure and retry policy</text>
    <rect x="475" y="460" width="162" height="4" rx="2" fill="#94a3b8" opacity="0.7"/>
  </g>

  <path d="M 750 332 H 812" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="830" y="165" width="250" height="335" rx="24" fill="#172235" stroke="#35506f"/>
    <text x="860" y="220" fill="#9fb0c8" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="2">SEMANTIC MODEL</text>
    <text x="860" y="264" fill="#f8fafc" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="24" font-weight="700">Useful workflows</text>
    <text x="860" y="312" fill="#cbd5e1" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="17">Files and media</text>
    <text x="860" y="352" fill="#cbd5e1" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="17">Mail and calendar</text>
    <text x="860" y="392" fill="#cbd5e1" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="17">Boards and tables</text>
    <text x="860" y="432" fill="#cbd5e1" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="17">Forms and inspectors</text>
    <rect x="860" y="460" width="142" height="4" rx="2" fill="#94a3b8" opacity="0.7"/>
  </g>

  <path d="M 1100 332 H 1162" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1180" y="165" width="150" height="335" rx="24" fill="#172235" stroke="#6d5bc7"/>
    <rect x="1180" y="165" width="150" height="10" rx="5" fill="url(#native)"/>
    <text x="1210" y="220" fill="#c4b5fd" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="2">NATIVE UI</text>
    <rect x="1210" y="272" width="90" height="72" rx="14" fill="#7c5ce5" opacity="0.24" stroke="#a78bfa"/>
    <rect x="1228" y="288" width="54" height="8" rx="4" fill="#ddd6fe"/>
    <rect x="1228" y="306" width="38" height="8" rx="4" fill="#a78bfa"/>
    <rect x="1223" y="374" width="64" height="100" rx="14" fill="#7c5ce5" opacity="0.24" stroke="#a78bfa"/>
    <rect x="1237" y="392" width="36" height="7" rx="3" fill="#ddd6fe"/>
    <rect x="1237" y="410" width="28" height="7" rx="3" fill="#a78bfa"/>
    <text x="1210" y="540" fill="#cbd5e1" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15">Desktop</text>
    <text x="1210" y="565" fill="#cbd5e1" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15">Android</text>
  </g>

  <text x="70" y="570" fill="#8fa0b9" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16">No endpoint, permission, payload, identity, or retry guarantee is invented between layers.</text>
</svg>
