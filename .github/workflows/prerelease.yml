name: Publish prerelease

on:
  push:
    tags:
      - "v0.*-alpha.*"
      - "v0.*-beta.*"
      - "v0.*-rc.*"

permissions:
  actions: read
  contents: read

concurrency:
  group: prerelease-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version-code: ${{ steps.version-code.outputs.value }}
      desktop-version: ${{ steps.version-code.outputs.desktop_version }}
      release-date: ${{ steps.version-code.outputs.release_date }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Authorize tagged source for signing
        run: |
          set -euo pipefail
          bash tools/test-prerelease-version.sh
          bash tools/verify-prerelease-version.sh "${GITHUB_REF_NAME}"
          test -f "docs/release-notes/${GITHUB_REF_NAME#v}.md"
          grep -Fq "## [${GITHUB_REF_NAME#v}]" CHANGELOG.md
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Allocate version code from trusted main CI
        id: version-code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success&per_page=100" |
            jq --arg sha "${GITHUB_SHA}" -e \
              '[.workflow_runs[] | select(.head_sha == $sha)] |
               if length == 0 then error("No successful main CI run") else true end' \
              >/dev/null
          if [[ "${GITHUB_REF_NAME}" =~ -(alpha|beta|rc)\.[1-9][0-9]*$ ]]; then
            channel="${BASH_REMATCH[1]}"
          else
            echo "::error::The release tag does not identify an allocated channel."
            exit 1
          fi
          source_sequence="$(git rev-list --count "${GITHUB_SHA}")"
          version_code="$(tools/derive-android-version-code.sh "${source_sequence}" "${channel}")"
          desktop_version="$(
            tools/derive-desktop-package-version.sh "${source_sequence}" "${channel}"
          )"
          release_started_at="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --jq .created_at
          )"
          release_date="$(date --utc --date="${release_started_at}" +%F)"
          {
            echo "value=${version_code}"
            echo "desktop_version=${desktop_version}"
            echo "release_date=${release_date}"
          } >>"${GITHUB_OUTPUT}"

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Require a prerelease version on main
        run: |
          bash tools/test-prerelease-version.sh
          bash tools/verify-prerelease-version.sh "${GITHUB_REF_NAME}"
          test -f "docs/release-notes/${GITHUB_REF_NAME#v}.md"
          grep -Fq "## [${GITHUB_REF_NAME#v}]" CHANGELOG.md
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Show approval checklist
        run: cat docs/prerelease-checklist.md >>"${GITHUB_STEP_SUMMARY}"

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Linux virtual filesystem runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2t64

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Check and test release source
        run: |
          bash tools/check-repository.sh
          bash tools/test-release-signing-config.sh
          bash tools/test-prerelease-update-contract.sh
          cargo test --locked
          ./gradlew --no-daemon \
            :contractAcquisition:test \
            :ui:desktopTest \
            :androidApp:testDebugUnitTest \
            :androidApp:assembleDebug

  desktop:
    needs:
      - validate
      - authorize-signing
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            artifact: nextcloud-native-linux
            direct_updates: "true"
            tasks: ":ui:packageDeb :ui:packageRpm"
            paths: |
              ui/build/compose/binaries/main/deb/*.deb
              ui/build/compose/binaries/main/rpm/*.rpm
          - runner: windows-latest
            platform: windows
            artifact: nextcloud-native-windows
            direct_updates: "true"
            tasks: ":ui:packageMsi"
            paths: ui/build/compose/binaries/main/msi/*.msi
          - runner: macos-15-intel
            platform: macos
            artifact: nextcloud-native-macos
            direct_updates: "false"
            tasks: ":ui:packageDmg"
            paths: ui/build/compose/binaries/main/dmg/*.dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    environment: prerelease
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Rust for Windows packaging
        if: matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build native desktop package
        shell: bash
        env:
          RELEASE_DESKTOP_VERSION: ${{ needs.authorize-signing.outputs.desktop-version }}
        run: |
          set +e
          ./gradlew --no-daemon \
            -PncDesktopPackageVersion="${RELEASE_DESKTOP_VERSION}" \
            -PncMacosPackageVersion="${RELEASE_DESKTOP_VERSION}" \
            -PncVersionName="${GITHUB_REF_NAME#v}" \
            -PncVersionCode="${{ needs.authorize-signing.outputs.version-code }}" \
            -PncAppStreamReleaseDate="${{ needs.authorize-signing.outputs.release-date }}" \
            -PncDesktopReleaseBuild=true \
            -PncDirectDesktopPackageUpdates="${{ matrix.direct_updates }}" \
            ${{ matrix.tasks }}
          status=$?
          if [[ "${status}" -ne 0 ]]; then
            find ui/build/compose/logs -type f -print -exec cat {} \; 2>/dev/null || true
          fi
          exit "${status}"

      - name: Verify unsigned Windows MSI
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          RELEASE_DESKTOP_VERSION: ${{ needs.authorize-signing.outputs.desktop-version }}
        run: |
          tools/verify-windows-package.ps1 `
            -PackageDirectory "ui/build/compose/binaries/main/msi" `
            -ExpectedVersion "${env:RELEASE_DESKTOP_VERSION}"

      - name: Attest Windows MSI provenance
        id: attest-windows-msi
        if: matrix.platform == 'windows'
        continue-on-error: true
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ui/build/compose/binaries/main/msi/*.msi

      - name: Retry Windows MSI provenance attestation
        if: >-
          matrix.platform == 'windows' &&
          steps.attest-windows-msi.outcome == 'failure'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ui/build/compose/binaries/main/msi/*.msi

      - name: Upload desktop package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 7

  android:
    needs: authorize-signing
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prerelease
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install pinned Android app bundle inspector
        run: |
          set -euo pipefail
          bundletool="${RUNNER_TEMP}/bundletool-all-1.18.3.jar"
          curl --fail --location --silent --show-error \
            "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" \
            --output "${bundletool}"
          printf '%s  %s\n' \
            "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29" \
            "${bundletool}" |
            sha256sum --check

      - name: Require protected Android signing secrets
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          NC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          NC_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          NC_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            NC_ANDROID_KEYSTORE_PASSWORD \
            NC_ANDROID_KEY_ALIAS \
            NC_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Required Android signing secret ${secret_name} is unavailable."
              exit 1
            fi
          done

      - name: Restore protected Android signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" |
            base64 --decode >"${RUNNER_TEMP}/nextcloud-native-release.keystore"

      - name: Verify protected Android signing identity
        env:
          NC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          NC_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          actual_certificate_sha256="$(keytool -list -v \
            -keystore "${RUNNER_TEMP}/nextcloud-native-release.keystore" \
            -storepass "${NC_ANDROID_KEYSTORE_PASSWORD}" \
            -alias "${NC_ANDROID_KEY_ALIAS}" |
            awk -F': ' '/SHA256:/{ fingerprint=$2; gsub(":", "", fingerprint); print tolower(fingerprint); exit }')"
          expected_certificate_sha256="$(tr -d ':[:space:]' \
            <release/android-signing-certificate.sha256 | tr '[:upper:]' '[:lower:]')"
          if [[ -z "${actual_certificate_sha256}" ]]; then
            echo "::error::The protected Android signing certificate could not be read."
            exit 1
          fi
          if [[ "${actual_certificate_sha256}" != "${expected_certificate_sha256}" ]]; then
            echo "::error::Protected Android signing certificate ${actual_certificate_sha256} does not match pinned certificate ${expected_certificate_sha256}."
            exit 1
          fi

      - name: Build signed Android release
        env:
          NC_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nextcloud-native-release.keystore
          NC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          NC_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          NC_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          RELEASE_VERSION_CODE: ${{ needs.authorize-signing.outputs.version-code }}
        run: |
          ./gradlew --no-daemon \
            -PncVersionCode="${RELEASE_VERSION_CODE}" \
            :androidApp:verifyReleaseLintGate \
            :androidApp:lintVitalDirectApk \
            :androidApp:lintVitalRelease \
            :androidApp:assembleDirectApk \
            :androidApp:bundleRelease

      - name: Verify Android signing and prepare artifacts
        id: android
        env:
          RELEASE_VERSION_CODE: ${{ needs.authorize-signing.outputs.version-code }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp androidApp/build/outputs/apk/directApk/androidApp-directApk.apk \
            "dist/nextcloud-native-${version}-android.apk"
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab \
            "dist/nextcloud-native-${version}-android.aab"
          apkanalyzer="${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer"
          tools/verify-android-artifact-metadata.sh \
            "${apkanalyzer}" \
            "dist/nextcloud-native-${version}-android.apk" \
            "dev.obiente.nextcloudnative" \
            "${version}" \
            "${RELEASE_VERSION_CODE}" \
            "26"
          tools/verify-android-app-bundle-metadata.sh \
            "$(command -v java)" \
            "${RUNNER_TEMP}/bundletool-all-1.18.3.jar" \
            "dist/nextcloud-native-${version}-android.aab" \
            "dev.obiente.nextcloudnative" \
            "${version}" \
            "${RELEASE_VERSION_CODE}" \
            "26"
          apksigner_path="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          if [[ ! -x "${apksigner_path}" ]]; then
            echo "::error::Expected Android Build Tools 35.0.0 apksigner was not found."
            exit 1
          fi
          if ! "${apksigner_path}" verify --verbose --print-certs \
            "dist/nextcloud-native-${version}-android.apk" \
            >"${RUNNER_TEMP}/apk-signing.txt" 2>&1; then
            tail -100 "${RUNNER_TEMP}/apk-signing.txt"
            echo "::error::APK cryptographic signature verification failed."
            exit 1
          fi
          if ! jarsigner -verify \
            "dist/nextcloud-native-${version}-android.aab" \
            >"${RUNNER_TEMP}/aab-signing.txt" 2>&1; then
            tail -100 "${RUNNER_TEMP}/aab-signing.txt"
            echo "::error::App Bundle cryptographic signature verification failed."
            exit 1
          fi
          if ! certificate_sha256="$(
            tools/extract-apksigner-certificate-sha256.sh \
              <"${RUNNER_TEMP}/apk-signing.txt"
          )"; then
            tail -100 "${RUNNER_TEMP}/apk-signing.txt"
            echo "::error::APK signing certificate fingerprint was not reported."
            exit 1
          fi
          if ! keytool -printcert \
            -jarfile "dist/nextcloud-native-${version}-android.aab" \
            >"${RUNNER_TEMP}/aab-certificate.txt" 2>&1; then
            tail -100 "${RUNNER_TEMP}/aab-certificate.txt"
            echo "::error::App Bundle signing certificate could not be read."
            exit 1
          fi
          aab_certificate_sha256="$(awk -F': ' \
            '/SHA256:/{ fingerprint=$2; gsub(":", "", fingerprint); print tolower(fingerprint); exit }' \
            "${RUNNER_TEMP}/aab-certificate.txt")"
          if [[ -z "${aab_certificate_sha256}" ]]; then
            tail -100 "${RUNNER_TEMP}/aab-certificate.txt"
            echo "::error::App Bundle signing certificate fingerprint was not reported."
            exit 1
          fi
          expected_certificate_sha256="$(tr -d ':[:space:]' \
            <release/android-signing-certificate.sha256 | tr '[:upper:]' '[:lower:]')"
          if [[ "${certificate_sha256}" != "${expected_certificate_sha256}" ]]; then
            echo "::error::APK signing certificate ${certificate_sha256} does not match pinned certificate ${expected_certificate_sha256}."
            exit 1
          fi
          if [[ "${aab_certificate_sha256}" != "${expected_certificate_sha256}" ]]; then
            echo "::error::App Bundle signing certificate ${aab_certificate_sha256} does not match pinned certificate ${expected_certificate_sha256}."
            exit 1
          fi
          apk_sha256="$(sha256sum "dist/nextcloud-native-${version}-android.apk" | awk '{print $1}')"
          printf '%s\n' "${certificate_sha256}" >"dist/android-certificate.sha256"
          printf '%s\n' "${apk_sha256}" >"dist/android-apk.sha256"

      - name: Remove protected Android signing key
        if: always()
        run: |
          keystore="${RUNNER_TEMP}/nextcloud-native-release.keystore"
          if [[ -f "${keystore}" ]]; then
            shred --remove "${keystore}"
          fi

      - name: Upload Android packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nextcloud-native-android
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  stage-assets:
    needs:
      - authorize-signing
      - desktop
      - android
    if: always()
    runs-on: ubuntu-latest
    outputs:
      successful-platforms: ${{ steps.platforms.outputs.successful }}
      available-platforms: ${{ steps.platforms.outputs.available }}
      already-published: ${{ steps.release.outputs.already-published }}
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download successful platform packages
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: nextcloud-native-*
          path: artifacts

      - name: Count successful platforms
        id: platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing_assets="$(
            gh release view "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[].name' 2>/dev/null || true
          )"
          successful=0
          available=()
          for platform in android linux windows macos; do
            artifact="artifacts/nextcloud-native-${platform}"
            staged=false
            case "${platform}" in
              android)
                grep -Eq '^nextcloud-native-.*-android\.apk$' <<<"${existing_assets}" &&
                  grep -Fxq 'update-manifest.json' <<<"${existing_assets}" &&
                  staged=true
                ;;
              linux)
                grep -Eq '\.(deb|rpm)$' <<<"${existing_assets}" &&
                  staged=true
                ;;
              windows)
                grep -Eq '\.msi$' <<<"${existing_assets}" &&
                  staged=true
                ;;
              macos)
                grep -Eq '\.dmg$' <<<"${existing_assets}" &&
                  staged=true
                ;;
            esac
            if {
              [[ -d "${artifact}" ]] &&
                find "${artifact}" -type f -print -quit | grep -q .
            } || [[ "${staged}" = "true" ]]; then
              successful=$((successful + 1))
              available+=("${platform}")
              echo "${platform}: available"
            else
              echo "${platform}: unavailable"
            fi
          done
          echo "Successful platforms: ${successful}/4"
          echo "successful=${successful}" >>"${GITHUB_OUTPUT}"
          echo "available=$(IFS=,; echo "${available[*]}")" >>"${GITHUB_OUTPUT}"
          if [[ "${successful}" -eq 0 ]]; then
            test "$(
              gh release view "${GITHUB_REF_NAME}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json isDraft \
                --jq '.isDraft'
            )" = "false"
          fi

      - name: Prepare release assets
        if: steps.platforms.outputs.successful != '0'
        env:
          RELEASE_VERSION_CODE: ${{ needs.authorize-signing.outputs.version-code }}
          AVAILABLE_PLATFORMS: ${{ steps.platforms.outputs.available }}
          SUCCESSFUL_PLATFORMS: ${{ steps.platforms.outputs.successful }}
        run: |
          set -euo pipefail
          mkdir -p artifacts dist
          find artifacts -mindepth 2 -type f \
            -exec cp -t dist -- {} +
          version="${GITHUB_REF_NAME#v}"
          version_code="${RELEASE_VERSION_CODE}"
          apk_name="nextcloud-native-${version}-android.apk"
          if [[ -f "dist/${apk_name}" ]]; then
            apk_size="$(stat --format='%s' "dist/${apk_name}")"
            apk_sha256="$(cat dist/android-apk.sha256)"
            certificate_sha256="$(cat dist/android-certificate.sha256)"
            signer_digests="$(jq -cn --arg digest "${certificate_sha256}" '[$digest]')"
            tools/create-prerelease-update-manifest.sh \
              dist/update-manifest.json \
              "${version}" \
              "${version_code}" \
              "${apk_name}" \
              "${apk_size}" \
              "${apk_sha256}" \
              "${signer_digests}"
          fi
          rm -f dist/android-apk.sha256 dist/android-certificate.sha256
          awk '
            NR == 1 && /^# / { next }
            NR == 2 && /^$/ { next }
            { print }
          ' "docs/release-notes/${version}.md" >"${RUNNER_TEMP}/release-notes.md"
          if [[ "${SUCCESSFUL_PLATFORMS}" -lt 4 ]]; then
            {
              printf '\n## Build availability\n\n'
              printf '| Platform | Status |\n'
              printf '| --- | --- |\n'
              for platform in android linux windows macos; do
                case "${platform}" in
                  android) label="Android" ;;
                  linux) label="Linux" ;;
                  windows) label="Windows" ;;
                  macos) label="macOS" ;;
                esac
                if [[ ",${AVAILABLE_PLATFORMS}," == *",${platform},"* ]]; then
                  printf '| %s | Available |\n' "${label}"
                else
                  printf '| %s | Unavailable |\n' "${label}"
                fi
              done
            } >>"${RUNNER_TEMP}/release-notes.md"
          fi
          if [[ ",${AVAILABLE_PLATFORMS}," == *",windows,"* ]]; then
            {
              printf '\n## Windows installation\n\n'
              printf '%s\n' \
                'The Windows MSI is currently unsigned. Windows may show a Microsoft Defender SmartScreen warning. After confirming that the download came from this release, choose `More info > Run anyway` to continue. Managed devices may block unsigned installers.'
              printf '\n'
              printf '%s\n' \
                'Verify build provenance with `gh attestation verify <downloaded-msi> --repo Obiente/nc-native` and compare the file with `SHA256SUMS`.'
            } >>"${RUNNER_TEMP}/release-notes.md"
          fi

      - name: Stage assets on the tagged draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION_CODE: ${{ needs.authorize-signing.outputs.version-code }}
          SUCCESSFUL_PLATFORMS: ${{ steps.platforms.outputs.successful }}
        run: |
          set -euo pipefail
          echo "already-published=false" >>"${GITHUB_OUTPUT}"
          version="${GITHUB_REF_NAME#v}"
          existing_release="$(
            gh release view "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json isDraft 2>/dev/null || true
          )"
          if [[ -n "${existing_release}" ]] &&
            [[ "$(jq -r '.isDraft' <<<"${existing_release}")" = "false" ]]; then
            echo "already-published=true" >>"${GITHUB_OUTPUT}"
            echo "Published prerelease ${GITHUB_REF_NAME} is immutable; no assets or metadata were changed."
            exit 0
          fi

          test "${SUCCESSFUL_PLATFORMS}" -gt 0
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          if [[ -n "${existing_release}" ]]; then
            existing_assets="$(
              gh release view "${GITHUB_REF_NAME}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json assets \
                --jq '.assets[].name'
            )"
            current_android=false
            if find dist -maxdepth 1 -type f \
              -name 'nextcloud-native-*-android.apk' -print -quit | grep -q . &&
              [[ -f dist/update-manifest.json ]]; then
              current_android=true
            fi
            existing_android_apk=false
            existing_android_manifest=false
            existing_android_any=false
            grep -Eq '^nextcloud-native-.*-android\.apk$' <<<"${existing_assets}" &&
              existing_android_apk=true
            grep -Fxq 'update-manifest.json' <<<"${existing_assets}" &&
              existing_android_manifest=true
            grep -Eq '(^nextcloud-native-.*-android\.(apk|aab)$|^update-manifest\.json$)' \
              <<<"${existing_assets}" &&
              existing_android_any=true
            if [[ "${current_android}" = "false" ]] &&
              [[ "${existing_android_any}" = "true" ]] &&
              {
                [[ "${existing_android_apk}" = "false" ]] ||
                  [[ "${existing_android_manifest}" = "false" ]]
              }; then
              while IFS= read -r partial_asset; do
                case "${partial_asset}" in
                  nextcloud-native-*-android.apk|nextcloud-native-*-android.aab|update-manifest.json)
                    gh release delete-asset "${GITHUB_REF_NAME}" "${partial_asset}" \
                      --repo "${GITHUB_REPOSITORY}" \
                      --yes
                    ;;
                esac
              done <<<"${existing_assets}"
              existing_assets="$(
                gh release view "${GITHUB_REF_NAME}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --json assets \
                  --jq '.assets[].name'
              )"
            fi
            for asset in "${assets[@]}"; do
              name="$(basename "${asset}")"
              case "${name}" in
                nextcloud-native-*-android.apk|nextcloud-native-*-android.aab|update-manifest.json)
                  if [[ "${current_android}" = "true" ]]; then
                    gh release upload "${GITHUB_REF_NAME}" "${asset}" \
                      --repo "${GITHUB_REPOSITORY}" \
                      --clobber
                    continue
                  fi
                  ;;
              esac
              if grep -Fxq "${name}" <<<"${existing_assets}"; then
                echo "Retaining staged asset ${name}."
              else
                gh release upload "${GITHUB_REF_NAME}" "${asset}" \
                  --repo "${GITHUB_REPOSITORY}"
              fi
            done
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --prerelease \
              --latest=false \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --title "Nextcloud Native ${version}"
          else
            test "${#assets[@]}" -gt 0
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --prerelease \
              --latest=false \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --title "Nextcloud Native ${version}"
          fi

          if [[ "${SUCCESSFUL_PLATFORMS}" -ge 3 ]]; then
            canonical="${RUNNER_TEMP}/canonical-release-assets"
            mkdir -p "${canonical}"
            gh release download "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --dir "${canonical}"
            if [[ -f "${canonical}/SHA256SUMS" ]]; then
              rm "${canonical}/SHA256SUMS"
            fi
            mapfile -d '' canonical_apks < <(
              find "${canonical}" -maxdepth 1 -type f \
                -name 'nextcloud-native-*-android.apk' -print0
            )
            if [[ "${#canonical_apks[@]}" -gt 0 ]] ||
              [[ -f "${canonical}/update-manifest.json" ]]; then
              test "${#canonical_apks[@]}" -eq 1
              test -f "${canonical}/update-manifest.json"
              tools/verify-android-update-manifest-assets.sh \
                "${canonical}/update-manifest.json" \
                "${canonical_apks[0]}" \
                "${GITHUB_REPOSITORY}" \
                "${GITHUB_REF_NAME}" \
                "prerelease-v1" \
                "${version}" \
                "${RELEASE_VERSION_CODE}"
            fi
            if tools/has-direct-desktop-update-assets.sh "${canonical}"; then
              tools/create-desktop-update-manifest.sh \
                "${canonical}/desktop-update-manifest.json" \
                prerelease-v1 \
                "${GITHUB_REF_NAME}" \
                "${version}" \
                "${RELEASE_VERSION_CODE}" \
                "${{ needs.authorize-signing.outputs.desktop-version }}" \
                "${canonical}"
              tools/verify-desktop-update-manifest-assets.sh \
                "${canonical}/desktop-update-manifest.json" \
                "${canonical}" \
                "${GITHUB_REPOSITORY}" \
                "${GITHUB_REF_NAME}" \
                prerelease-v1 \
                "${version}" \
                "${RELEASE_VERSION_CODE}" \
                "${{ needs.authorize-signing.outputs.desktop-version }}"
              gh release upload "${GITHUB_REF_NAME}" \
                "${canonical}/desktop-update-manifest.json" \
                --repo "${GITHUB_REPOSITORY}" \
                --clobber
            elif [[ -f "${canonical}/desktop-update-manifest.json" ]]; then
              gh release delete-asset "${GITHUB_REF_NAME}" desktop-update-manifest.json \
                --repo "${GITHUB_REPOSITORY}" \
                --yes
              rm "${canonical}/desktop-update-manifest.json"
            fi
            (
              cd "${canonical}"
              find . -maxdepth 1 -type f -printf '%P\0' |
                sort -z |
                xargs -0 sha256sum >"${RUNNER_TEMP}/SHA256SUMS"
            )
            gh release upload "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/SHA256SUMS" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          fi

  winget-candidate:
    needs: stage-assets
    if: contains(needs.stage-assets.outputs.available-platforms, 'windows')
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download canonical Windows release package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path "canonical-windows" | Out-Null
          gh release download $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --pattern '*.msi' `
            --dir "canonical-windows"

      - name: Generate WinGet manifest candidate
        shell: pwsh
        run: |
          $packageVersion = $env:GITHUB_REF_NAME.Substring(1)
          tools/create-winget-manifests.ps1 `
            -PackageDirectory "canonical-windows" `
            -PackageVersion $packageVersion `
            -ReleaseTag $env:GITHUB_REF_NAME `
            -OutputDirectory "winget"

      - name: Upload WinGet manifest candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: winget-manifest-candidate-${{ github.ref_name }}
          path: winget/**/*.yaml
          if-no-files-found: error
          retention-days: 14

  release-quorum:
    needs: stage-assets
    runs-on: ubuntu-latest
    steps:
      - name: Require at least three successful platforms
        env:
          ALREADY_PUBLISHED: ${{ needs.stage-assets.outputs.already-published }}
          SUCCESSFUL_PLATFORMS: ${{ needs.stage-assets.outputs.successful-platforms }}
        run: |
          echo "Successful platforms: ${SUCCESSFUL_PLATFORMS}/4"
          [[ "${ALREADY_PUBLISHED}" = "true" ]] ||
            test "${SUCCESSFUL_PLATFORMS}" -ge 3

  publish:
    needs:
      - validate
      - stage-assets
      - release-quorum
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Publish the staged GitHub prerelease
        if: needs.stage-assets.outputs.already-published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft=false \
            --prerelease \
            --latest=false

  promote:
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: app-prerelease-channel
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Advance the app prerelease channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p channel
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern '*update-manifest.json' \
            --dir channel
          android_manifest="-"
          desktop_manifest="-"
          [[ -f channel/update-manifest.json ]] && android_manifest=channel/update-manifest.json
          [[ -f channel/desktop-update-manifest.json ]] && desktop_manifest=channel/desktop-update-manifest.json
          tools/promote-app-update-channel.sh \
            "${GITHUB_REPOSITORY}" \
            channel-prerelease \
            "${GITHUB_REF_NAME}" \
            "${GITHUB_SHA}" \
            "${android_manifest}" \
            "${desktop_manifest}" \
            1
