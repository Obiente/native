name: Publish prerelease

on:
  push:
    branches:
      - main
    tags:
      - "v0.*-alpha.*"
      - "v0.*-beta.*"
      - "v0.*-rc.*"

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release-context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      curated: ${{ steps.release.outputs.curated }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve immutable release identity
        id: release
        env:
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            curated=true
          else
            test "${GITHUB_REF}" = "refs/heads/main"
            short_sha="${GITHUB_SHA:0:8}"
            timestamp="$(date --utc --date="${COMMIT_TIMESTAMP}" +%Y%m%d-%H%M)"
            tag="nightly-${timestamp}-run${GITHUB_RUN_NUMBER}-${short_sha}"
            curated=false
          fi
          echo "curated=${curated}" >>"${GITHUB_OUTPUT}"
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >>"${GITHUB_OUTPUT}"

  authorize-signing:
    needs: release-context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Authorize exact main source for signing
        env:
          CURATED_RELEASE: ${{ needs.release-context.outputs.curated }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${CURATED_RELEASE}" == "true" ]]; then
            bash tools/test-prerelease-version.sh
            bash tools/verify-prerelease-version.sh "${RELEASE_TAG}"
            test -f "docs/release-notes/${RELEASE_TAG#v}.md"
            grep -Fq "## [${RELEASE_TAG#v}]" CHANGELOG.md
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

  validate:
    needs: release-context
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Require authorized release source on main
        env:
          CURATED_RELEASE: ${{ needs.release-context.outputs.curated }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${CURATED_RELEASE}" == "true" ]]; then
            bash tools/test-prerelease-version.sh
            bash tools/verify-prerelease-version.sh "${RELEASE_TAG}"
            test -f "docs/release-notes/${RELEASE_TAG#v}.md"
            grep -Fq "## [${RELEASE_TAG#v}]" CHANGELOG.md
          fi
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Show approval checklist
        run: cat docs/prerelease-checklist.md >>"${GITHUB_STEP_SUMMARY}"

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Check and test release source
        run: |
          bash tools/check-repository.sh
          bash tools/test-release-signing-config.sh
          bash tools/test-prerelease-update-contract.sh
          cargo test --locked
          ./gradlew --no-daemon \
            :contractAcquisition:test \
            :ui:desktopTest \
            :androidApp:testDebugUnitTest \
            :androidApp:assembleDebug

  desktop:
    needs: validate
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: nextcloud-native-linux
            tasks: ":ui:packageDeb :ui:packageRpm"
            paths: |
              ui/build/compose/binaries/main/deb/*.deb
              ui/build/compose/binaries/main/rpm/*.rpm
          - runner: windows-latest
            artifact: nextcloud-native-windows
            tasks: ":ui:packageMsi"
            paths: ui/build/compose/binaries/main/msi/*.msi
          - runner: macos-15-intel
            artifact: nextcloud-native-macos
            tasks: ":ui:packageDmg"
            paths: ui/build/compose/binaries/main/dmg/*.dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build native desktop package
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon ${{ matrix.tasks }}
          status=$?
          if [[ "${status}" -ne 0 ]]; then
            find ui/build/compose/logs -type f -print -exec cat {} \; 2>/dev/null || true
          fi
          exit "${status}"

      - name: Upload desktop package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 7

  android:
    needs:
      - authorize-signing
      - release-context
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prerelease
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Restore protected Android signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "${ANDROID_RELEASE_KEYSTORE_BASE64}"
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" |
            base64 --decode >"${RUNNER_TEMP}/nextcloud-native-release.keystore"

      - name: Verify protected Android signing identity
        env:
          NC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          NC_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          actual_certificate_sha256="$(keytool -list -v \
            -keystore "${RUNNER_TEMP}/nextcloud-native-release.keystore" \
            -storepass "${NC_ANDROID_KEYSTORE_PASSWORD}" \
            -alias "${NC_ANDROID_KEY_ALIAS}" |
            awk -F': ' '/SHA256:/{ fingerprint=$2; gsub(":", "", fingerprint); print tolower(fingerprint); exit }')"
          expected_certificate_sha256="$(tr -d ':[:space:]' \
            <release/android-signing-certificate.sha256 | tr '[:upper:]' '[:lower:]')"
          if [[ -z "${actual_certificate_sha256}" ]]; then
            echo "::error::The protected Android signing certificate could not be read."
            exit 1
          fi
          if [[ "${actual_certificate_sha256}" != "${expected_certificate_sha256}" ]]; then
            echo "::error::Protected Android signing certificate ${actual_certificate_sha256} does not match pinned certificate ${expected_certificate_sha256}."
            exit 1
          fi

      - name: Build signed Android release
        env:
          NC_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nextcloud-native-release.keystore
          NC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          NC_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          NC_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon \
            :androidApp:verifyReleaseLintGate \
            :androidApp:lintVitalDirectApk \
            :androidApp:lintVitalRelease \
            :androidApp:assembleDirectApk \
            :androidApp:bundleRelease

      - name: Verify Android signing and prepare artifacts
        id: android
        env:
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"
          mkdir -p dist
          cp androidApp/build/outputs/apk/directApk/androidApp-directApk.apk \
            "dist/nextcloud-native-${version}-android.apk"
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab \
            "dist/nextcloud-native-${version}-android.aab"
          apksigner_path="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          if [[ ! -x "${apksigner_path}" ]]; then
            echo "::error::Expected Android Build Tools 35.0.0 apksigner was not found."
            exit 1
          fi
          if ! "${apksigner_path}" verify --verbose --print-certs \
            "dist/nextcloud-native-${version}-android.apk" \
            >"${RUNNER_TEMP}/apk-signing.txt" 2>&1; then
            tail -100 "${RUNNER_TEMP}/apk-signing.txt"
            echo "::error::APK cryptographic signature verification failed."
            exit 1
          fi
          if ! jarsigner -verify \
            "dist/nextcloud-native-${version}-android.aab" \
            >"${RUNNER_TEMP}/aab-signing.txt" 2>&1; then
            tail -100 "${RUNNER_TEMP}/aab-signing.txt"
            echo "::error::App Bundle cryptographic signature verification failed."
            exit 1
          fi
          if ! certificate_sha256="$(
            tools/extract-apksigner-certificate-sha256.sh \
              <"${RUNNER_TEMP}/apk-signing.txt"
          )"; then
            tail -100 "${RUNNER_TEMP}/apk-signing.txt"
            echo "::error::APK signing certificate fingerprint was not reported."
            exit 1
          fi
          if ! keytool -printcert \
            -jarfile "dist/nextcloud-native-${version}-android.aab" \
            >"${RUNNER_TEMP}/aab-certificate.txt" 2>&1; then
            tail -100 "${RUNNER_TEMP}/aab-certificate.txt"
            echo "::error::App Bundle signing certificate could not be read."
            exit 1
          fi
          aab_certificate_sha256="$(awk -F': ' \
            '/SHA256:/{ fingerprint=$2; gsub(":", "", fingerprint); print tolower(fingerprint); exit }' \
            "${RUNNER_TEMP}/aab-certificate.txt")"
          if [[ -z "${aab_certificate_sha256}" ]]; then
            tail -100 "${RUNNER_TEMP}/aab-certificate.txt"
            echo "::error::App Bundle signing certificate fingerprint was not reported."
            exit 1
          fi
          expected_certificate_sha256="$(tr -d ':[:space:]' \
            <release/android-signing-certificate.sha256 | tr '[:upper:]' '[:lower:]')"
          if [[ "${certificate_sha256}" != "${expected_certificate_sha256}" ]]; then
            echo "::error::APK signing certificate ${certificate_sha256} does not match pinned certificate ${expected_certificate_sha256}."
            exit 1
          fi
          if [[ "${aab_certificate_sha256}" != "${expected_certificate_sha256}" ]]; then
            echo "::error::App Bundle signing certificate ${aab_certificate_sha256} does not match pinned certificate ${expected_certificate_sha256}."
            exit 1
          fi
          apk_sha256="$(sha256sum "dist/nextcloud-native-${version}-android.apk" | awk '{print $1}')"
          printf '%s\n' "${certificate_sha256}" >"dist/android-certificate.sha256"
          printf '%s\n' "${apk_sha256}" >"dist/android-apk.sha256"

      - name: Remove protected Android signing key
        if: always()
        run: |
          keystore="${RUNNER_TEMP}/nextcloud-native-release.keystore"
          if [[ -f "${keystore}" ]]; then
            shred --remove "${keystore}"
          fi

      - name: Upload Android packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nextcloud-native-android
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  stage-assets:
    needs:
      - release-context
      - desktop
      - android
    if: always()
    runs-on: ubuntu-latest
    outputs:
      successful-platforms: ${{ steps.platforms.outputs.successful }}
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download successful platform packages
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: nextcloud-native-*
          path: artifacts

      - name: Count successful platforms
        id: platforms
        run: |
          set -euo pipefail
          successful=0
          for platform in android linux windows macos; do
            artifact="artifacts/nextcloud-native-${platform}"
            if [[ -d "${artifact}" ]] &&
              find "${artifact}" -type f -print -quit | grep -q .; then
              successful=$((successful + 1))
              echo "${platform}: available"
            else
              echo "${platform}: unavailable"
            fi
          done
          echo "Successful platforms: ${successful}/4"
          echo "successful=${successful}" >>"${GITHUB_OUTPUT}"
          test "${successful}" -gt 0

      - name: Prepare release assets
        env:
          CURATED_RELEASE: ${{ needs.release-context.outputs.curated }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -mindepth 2 -type f \
            -exec cp -t dist -- {} +
          version="${RELEASE_VERSION}"
          version_code="$(awk -F= '$1 == "ncVersionCode" { print $2 }' gradle.properties)"
          apk_name="nextcloud-native-${version}-android.apk"
          if [[ "${CURATED_RELEASE}" == "true" && -f "dist/${apk_name}" ]]; then
            apk_size="$(stat --format='%s' "dist/${apk_name}")"
            apk_sha256="$(cat dist/android-apk.sha256)"
            certificate_sha256="$(cat dist/android-certificate.sha256)"
            signer_digests="$(jq -cn --arg digest "${certificate_sha256}" '[$digest]')"
            tools/create-prerelease-update-manifest.sh \
              dist/update-manifest.json \
              "${version}" \
              "${version_code}" \
              "${apk_name}" \
              "${apk_size}" \
              "${apk_sha256}" \
              "${signer_digests}"
          fi
          rm -f dist/android-apk.sha256 dist/android-certificate.sha256
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' |
              sort -z |
              xargs -0 sha256sum >SHA256SUMS
          )
          if [[ "${CURATED_RELEASE}" == "true" ]]; then
            awk '
              NR == 1 && /^# / { next }
              NR == 2 && /^$/ { next }
              { print }
            ' "docs/release-notes/${version}.md" >"${RUNNER_TEMP}/release-notes.md"
          else
            printf 'Automated nightly prerelease for commit `%s`.\n' \
              "${GITHUB_SHA:0:8}" >"${RUNNER_TEMP}/release-notes.md"
          fi
          if [[ "${{ steps.platforms.outputs.successful }}" -lt 4 ]]; then
            {
              printf '\n## Build availability\n\n'
              printf '| Platform | Status |\n'
              printf '| --- | --- |\n'
              for platform in android linux windows macos; do
                artifact="artifacts/nextcloud-native-${platform}"
                case "${platform}" in
                  android) label="Android" ;;
                  linux) label="Linux" ;;
                  windows) label="Windows" ;;
                  macos) label="macOS" ;;
                esac
                if [[ -d "${artifact}" ]] &&
                  find "${artifact}" -type f -print -quit | grep -q .; then
                  printf '| %s | Available |\n' "${label}"
                else
                  printf '| %s | Unavailable |\n' "${label}"
                fi
              done
            } >>"${RUNNER_TEMP}/release-notes.md"
          fi

      - name: Create immutable nightly tag
        if: needs.release-context.outputs.curated != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        run: |
          set -euo pipefail
          existing_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object.sha' 2>/dev/null || true
          )"
          if [[ -z "${existing_sha}" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${RELEASE_TAG}" \
              -f "sha=${GITHUB_SHA}" >/dev/null
          elif [[ "${existing_sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Nightly tag ${RELEASE_TAG} points to ${existing_sha}, not ${GITHUB_SHA}."
            exit 1
          fi

      - name: Stage assets on the immutable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --prerelease \
              --latest=false \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --title "Nextcloud Native ${RELEASE_VERSION}"
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --prerelease \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --title "Nextcloud Native ${RELEASE_VERSION}"
          fi

  release-policy:
    needs:
      - release-context
      - stage-assets
    runs-on: ubuntu-latest
    steps:
      - name: Apply channel publication threshold
        env:
          CURATED_RELEASE: ${{ needs.release-context.outputs.curated }}
          SUCCESSFUL_PLATFORMS: ${{ needs.stage-assets.outputs.successful-platforms }}
        run: |
          echo "Successful platforms: ${SUCCESSFUL_PLATFORMS}/4"
          if [[ "${CURATED_RELEASE}" == "true" ]]; then
            test "${SUCCESSFUL_PLATFORMS}" -ge 3
          else
            test "${SUCCESSFUL_PLATFORMS}" -ge 1
          fi

  publish:
    needs:
      - release-context
      - validate
      - stage-assets
      - release-policy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the staged GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        run: |
          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft=false \
            --prerelease \
            --latest=false
