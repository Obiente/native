name: Publish prerelease

on:
  push:
    tags:
      - "v0.*-alpha.*"
      - "v0.*-beta.*"
      - "v0.*-rc.*"

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Authorize tagged source for signing
        run: |
          set -euo pipefail
          bash tools/test-prerelease-version.sh
          bash tools/verify-prerelease-version.sh "${GITHUB_REF_NAME}"
          test -f "docs/release-notes/${GITHUB_REF_NAME#v}.md"
          grep -Fq "## [${GITHUB_REF_NAME#v}]" CHANGELOG.md
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Require a prerelease version on main
        run: |
          bash tools/test-prerelease-version.sh
          bash tools/verify-prerelease-version.sh "${GITHUB_REF_NAME}"
          test -f "docs/release-notes/${GITHUB_REF_NAME#v}.md"
          grep -Fq "## [${GITHUB_REF_NAME#v}]" CHANGELOG.md
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Show approval checklist
        run: cat docs/prerelease-checklist.md >>"${GITHUB_STEP_SUMMARY}"

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Check and test release source
        run: |
          bash tools/check-repository.sh
          bash tools/test-release-signing-config.sh
          bash tools/test-prerelease-update-contract.sh
          cargo test --locked
          ./gradlew --no-daemon \
            :contractAcquisition:test \
            :ui:desktopTest \
            :androidApp:testDebugUnitTest \
            :androidApp:assembleDebug

  desktop:
    needs: validate
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: nextcloud-native-linux
            tasks: ":ui:packageDeb :ui:packageRpm"
            paths: |
              ui/build/compose/binaries/main/deb/*.deb
              ui/build/compose/binaries/main/rpm/*.rpm
          - runner: windows-latest
            artifact: nextcloud-native-windows
            tasks: ":ui:packageMsi"
            paths: ui/build/compose/binaries/main/msi/*.msi
          - runner: macos-15-intel
            artifact: nextcloud-native-macos
            tasks: ":ui:packageDmg"
            paths: ui/build/compose/binaries/main/dmg/*.dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build native desktop package
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon ${{ matrix.tasks }}
          status=$?
          if [[ "${status}" -ne 0 ]]; then
            find ui/build/compose/logs -type f -print -exec cat {} \; 2>/dev/null || true
          fi
          exit "${status}"

      - name: Upload desktop package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 7

  android:
    needs: authorize-signing
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prerelease
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Restore protected Android signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "${ANDROID_RELEASE_KEYSTORE_BASE64}"
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" |
            base64 --decode >"${RUNNER_TEMP}/nextcloud-native-release.keystore"

      - name: Build signed Android release
        env:
          NC_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nextcloud-native-release.keystore
          NC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          NC_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          NC_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon \
            :androidApp:verifyReleaseLintGate \
            :androidApp:lintVitalDirectApk \
            :androidApp:lintVitalRelease \
            :androidApp:assembleDirectApk \
            :androidApp:bundleRelease

      - name: Verify Android signing and prepare artifacts
        id: android
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp androidApp/build/outputs/apk/directApk/androidApp-directApk.apk \
            "dist/nextcloud-native-${version}-android.apk"
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab \
            "dist/nextcloud-native-${version}-android.aab"
          apksigner_path="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -print |
            sort -V | tail -n 1)"
          test -n "${apksigner_path}"
          "${apksigner_path}" verify --verbose --print-certs \
            "dist/nextcloud-native-${version}-android.apk" >"${RUNNER_TEMP}/apk-signing.txt"
          jarsigner -verify \
            "dist/nextcloud-native-${version}-android.aab" >/dev/null
          certificate_sha256="$(awk -F': ' \
            '/Signer #1 certificate SHA-256 digest:/ { print $2; exit }' \
            "${RUNNER_TEMP}/apk-signing.txt" | tr '[:upper:]' '[:lower:]')"
          test -n "${certificate_sha256}"
          aab_certificate_sha256="$(keytool -printcert \
            -jarfile "dist/nextcloud-native-${version}-android.aab" |
            awk -F': ' '/SHA256:/{ fingerprint=$2; gsub(":", "", fingerprint); print tolower(fingerprint); exit }')"
          test -n "${aab_certificate_sha256}"
          expected_certificate_sha256="$(tr -d ':[:space:]' \
            <release/android-signing-certificate.sha256 | tr '[:upper:]' '[:lower:]')"
          test "${certificate_sha256}" = "${expected_certificate_sha256}"
          test "${aab_certificate_sha256}" = "${expected_certificate_sha256}"
          apk_sha256="$(sha256sum "dist/nextcloud-native-${version}-android.apk" | awk '{print $1}')"
          printf '%s\n' "${certificate_sha256}" >"dist/android-certificate.sha256"
          printf '%s\n' "${apk_sha256}" >"dist/android-apk.sha256"

      - name: Remove protected Android signing key
        if: always()
        run: |
          keystore="${RUNNER_TEMP}/nextcloud-native-release.keystore"
          if [[ -f "${keystore}" ]]; then
            shred --remove "${keystore}"
          fi

      - name: Upload Android packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nextcloud-native-android
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  stage-assets:
    needs:
      - desktop
      - android
    if: always()
    runs-on: ubuntu-latest
    outputs:
      successful-platforms: ${{ steps.platforms.outputs.successful }}
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download successful platform packages
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: nextcloud-native-*
          path: artifacts

      - name: Count successful platforms
        id: platforms
        run: |
          set -euo pipefail
          successful=0
          for platform in android linux windows macos; do
            artifact="artifacts/nextcloud-native-${platform}"
            if [[ -d "${artifact}" ]] &&
              find "${artifact}" -type f -print -quit | grep -q .; then
              successful=$((successful + 1))
              echo "${platform}: available"
            else
              echo "${platform}: unavailable"
            fi
          done
          echo "Successful platforms: ${successful}/4"
          echo "successful=${successful}" >>"${GITHUB_OUTPUT}"
          test "${successful}" -gt 0

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -mindepth 2 -type f \
            -exec cp -t dist -- {} +
          version="${GITHUB_REF_NAME#v}"
          version_code="$(awk -F= '$1 == "ncVersionCode" { print $2 }' gradle.properties)"
          apk_name="nextcloud-native-${version}-android.apk"
          if [[ -f "dist/${apk_name}" ]]; then
            apk_size="$(stat --format='%s' "dist/${apk_name}")"
            apk_sha256="$(cat dist/android-apk.sha256)"
            certificate_sha256="$(cat dist/android-certificate.sha256)"
            signer_digests="$(jq -cn --arg digest "${certificate_sha256}" '[$digest]')"
            tools/create-prerelease-update-manifest.sh \
              dist/update-manifest.json \
              "${version}" \
              "${version_code}" \
              "${apk_name}" \
              "${apk_size}" \
              "${apk_sha256}" \
              "${signer_digests}"
          fi
          rm -f dist/android-apk.sha256 dist/android-certificate.sha256
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' |
              sort -z |
              xargs -0 sha256sum >SHA256SUMS
          )
          awk '
            NR == 1 && /^# / { next }
            NR == 2 && /^$/ { next }
            { print }
          ' "docs/release-notes/${version}.md" >"${RUNNER_TEMP}/release-notes.md"
          if [[ "${{ steps.platforms.outputs.successful }}" -lt 4 ]]; then
            {
              printf '\n## Build availability\n\n'
              printf '| Platform | Status |\n'
              printf '| --- | --- |\n'
              for platform in android linux windows macos; do
                artifact="artifacts/nextcloud-native-${platform}"
                case "${platform}" in
                  android) label="Android" ;;
                  linux) label="Linux" ;;
                  windows) label="Windows" ;;
                  macos) label="macOS" ;;
                esac
                if [[ -d "${artifact}" ]] &&
                  find "${artifact}" -type f -print -quit | grep -q .; then
                  printf '| %s | ✅ Available |\n' "${label}"
                else
                  printf '| %s | ❌ Unavailable |\n' "${label}"
                fi
              done
            } >>"${RUNNER_TEMP}/release-notes.md"
          fi

      - name: Stage assets on the tagged draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --prerelease \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --title "Nextcloud Native ${version}"

  release-quorum:
    needs: stage-assets
    runs-on: ubuntu-latest
    steps:
      - name: Require at least three successful platforms
        env:
          SUCCESSFUL_PLATFORMS: ${{ needs.stage-assets.outputs.successful-platforms }}
        run: |
          echo "Successful platforms: ${SUCCESSFUL_PLATFORMS}/4"
          test "${SUCCESSFUL_PLATFORMS}" -ge 3

  publish:
    needs:
      - validate
      - stage-assets
      - release-quorum
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the staged GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft=false \
            --prerelease \
            --latest=false
