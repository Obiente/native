name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Detect app build changes
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            app:
              - ".github/workflows/ci.yml"
              - "androidApp/**"
              - "contractAcquisition/**"
              - "ui/**"
              - "src/**"
              - "tests/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "build.gradle.kts"
              - "settings.gradle.kts"
              - "gradle.properties"
              - "gradle/**"
              - "gradlew"
              - "gradlew.bat"

      - name: Check repository hygiene
        run: |
          bash tools/check-repository.sh
          bash tools/test-prerelease-update-contract.sh

      - name: Set up JDK 21
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.app == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Cache Cargo dependencies and build output
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.app == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v1-

      - name: Set up Android SDK
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.app == 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android platform
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.app == 'true'
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Test semantic compiler
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.app == 'true'
        run: cargo test --locked

      - name: Test shared UI and build desktop plus Android
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.app == 'true'
        run: |
          ./gradlew --no-daemon \
            :contractAcquisition:test \
            :ui:desktopTest \
            :androidApp:testDebugUnitTest \
            :ui:createDistributable \
            :androidApp:assembleDebug

      - name: Upload Linux desktop app
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.app == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nextcloud-native-linux
          path: ui/build/compose/binaries/main/app/NextcloudNative
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android debug APK
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.app == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nextcloud-native-android-debug
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Report skipped app build
        if: github.event_name != 'workflow_dispatch' && steps.changes.outputs.app != 'true'
        run: echo "No app source or build-system changes; compilation was skipped." >>"${GITHUB_STEP_SUMMARY}"
