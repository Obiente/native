name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect build scopes
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            rust:
              - ".github/workflows/ci.yml"
              - "src/**"
              - "tests/**"
              - "Cargo.toml"
              - "Cargo.lock"
            contract:
              - ".github/workflows/ci.yml"
              - "contractAcquisition/**"
              - "build.gradle.kts"
              - "settings.gradle.kts"
              - "gradle.properties"
              - "gradle/**"
              - "gradlew"
              - "gradlew.bat"
            desktop:
              - ".github/workflows/ci.yml"
              - "contractAcquisition/**"
              - "ui/build.gradle.kts"
              - "ui/src/commonMain/**"
              - "ui/src/commonTest/**"
              - "ui/src/desktopMain/**"
              - "ui/src/desktopTest/**"
              - "build.gradle.kts"
              - "settings.gradle.kts"
              - "gradle.properties"
              - "gradle/**"
              - "gradlew"
              - "gradlew.bat"
            android:
              - ".github/workflows/ci.yml"
              - "androidApp/**"
              - "contractAcquisition/**"
              - "ui/build.gradle.kts"
              - "ui/src/commonMain/**"
              - "ui/src/androidMain/**"
              - "ui/src/androidUnitTest/**"
              - "build.gradle.kts"
              - "settings.gradle.kts"
              - "gradle.properties"
              - "gradle/**"
              - "gradlew"
              - "gradlew.bat"
            capture_inputs:
              - "tools/marketing-capture-inputs.txt"
              - "build.gradle.kts"
              - "settings.gradle.kts"
              - "gradle.properties"
              - "gradle/libs.versions.toml"
              - "gradle/wrapper/gradle-wrapper.properties"
              - "ui/build.gradle.kts"
              - "ui/src/commonMain/**"
              - "ui/src/desktopMain/kotlin/dev/obiente/nextcloudnative/nativeui/preview/**"
              - "ui/src/desktopMain/resources/marketing/**"
              - "website/package.json"
              - "website/package-lock.json"
              - "website/public/screenshots/**"
              - "website/scripts/marketing-captures.mjs"
              - "website/scripts/verify-marketing-captures.mjs"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Check repository hygiene
        run: |
          bash tools/check-repository.sh
          bash tools/test-prerelease-update-contract.sh

      - name: Set up Node.js for capture verification
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.capture_inputs == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install capture verification dependencies
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.capture_inputs == 'true'
        run: npm ci --prefix website

      - name: Verify marketing capture freshness
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.capture_inputs == 'true'
        run: node website/scripts/verify-marketing-captures.mjs

      - name: Require a changelog fragment
        if: >-
          github.event_name != 'workflow_dispatch' &&
          (
            github.event_name != 'pull_request' ||
            github.event.pull_request.user.login != 'dependabot[bot]'
          ) &&
          (
            github.event_name != 'push' ||
            github.event.head_commit.author.username != 'dependabot[bot]'
          )
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            printf 'No comparison base is available; fragment diff check skipped.\n'
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          fi
          node tools/changelog-fragments.mjs check-diff \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}"

      - name: Set up JDK 21
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.contract == 'true' ||
          steps.changes.outputs.desktop == 'true' ||
          steps.changes.outputs.android == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle build cache
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.contract == 'true' ||
          steps.changes.outputs.desktop == 'true' ||
          steps.changes.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Install Linux virtual filesystem runtime
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.desktop == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2t64

      - name: Cache Cargo dependencies and build output
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.rust == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v1-

      - name: Set up Android SDK
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.android == 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android platform
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.android == 'true'
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Test semantic compiler
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.rust == 'true'
        run: cargo test --locked

      - name: Test contract acquisition
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.contract == 'true'
        run: ./gradlew --no-daemon :contractAcquisition:test

      - name: Test and build desktop
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.desktop == 'true'
        run: |
          ./gradlew --no-daemon \
            :ui:desktopTest \
            :ui:createDistributable

      - name: Test and build Android
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.android == 'true'
        run: |
          ./gradlew --no-daemon \
            :androidApp:testDebugUnitTest \
            :androidApp:verifyReleaseLintGate \
            :androidApp:assembleDebug

      - name: Upload Linux desktop app
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.desktop == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nextcloud-native-linux
          path: ui/build/compose/binaries/main/app/NextcloudNative
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android debug APK
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.android == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nextcloud-native-android-debug
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Report skipped app build
        if: >-
          github.event_name != 'workflow_dispatch' &&
          steps.changes.outputs.rust != 'true' &&
          steps.changes.outputs.contract != 'true' &&
          steps.changes.outputs.desktop != 'true' &&
          steps.changes.outputs.android != 'true'
        run: echo "No compiler, contract, desktop, Android, or build-system changes; compilation was skipped." >>"${GITHUB_STEP_SUMMARY}"
