name: Publish nightly

on:
  workflow_run:
    workflows:
      - Build and test
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: android-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.source.outputs.eligible }}
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      version-code: ${{ steps.source.outputs.version_code }}
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Authorize trusted main source
        id: source
        env:
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: |
          set -euo pipefail
          test "${SOURCE_EVENT}" = "push"
          test "${SOURCE_HEAD_BRANCH}" = "main"
          test "${SOURCE_HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          git fetch --tags origin main
          git merge-base --is-ancestor "${SOURCE_SHA}" origin/main
          if git tag --points-at "${SOURCE_SHA}" |
            grep -Eq '^v0\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[1-9][0-9]*$'; then
            echo "eligible=false" >>"${GITHUB_OUTPUT}"
            echo "A curated prerelease already owns this source commit." \
              >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          timestamp="$(date --utc --date="${SOURCE_STARTED_AT}" +%Y%m%d-%H%M)"
          short_sha="${SOURCE_SHA:0:8}"
          tag="nightly-${timestamp}-run${SOURCE_RUN_NUMBER}-${short_sha}"
          version_code="$(tools/derive-android-version-code.sh "${SOURCE_RUN_NUMBER}" nightly)"
          {
            echo "eligible=true"
            echo "sha=${SOURCE_SHA}"
            echo "tag=${tag}"
            echo "version=${tag}"
            echo "version_code=${version_code}"
          } >>"${GITHUB_OUTPUT}"

  android:
    needs: source
    if: needs.source.outputs.eligible == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prerelease
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Require protected Android signing secrets
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          NC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          NC_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          NC_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            NC_ANDROID_KEYSTORE_PASSWORD \
            NC_ANDROID_KEY_ALIAS \
            NC_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Required Android signing secret ${secret_name} is unavailable."
              exit 1
            fi
          done

      - name: Restore protected Android signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" |
            base64 --decode >"${RUNNER_TEMP}/nextcloud-native-release.keystore"

      - name: Verify protected Android signing identity
        env:
          NC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          NC_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          actual_certificate_sha256="$(keytool -list -v \
            -keystore "${RUNNER_TEMP}/nextcloud-native-release.keystore" \
            -storepass "${NC_ANDROID_KEYSTORE_PASSWORD}" \
            -alias "${NC_ANDROID_KEY_ALIAS}" |
            awk -F': ' '/SHA256:/{ fingerprint=$2; gsub(":", "", fingerprint); print tolower(fingerprint); exit }')"
          expected_certificate_sha256="$(tr -d ':[:space:]' \
            <release/android-signing-certificate.sha256 | tr '[:upper:]' '[:lower:]')"
          test -n "${actual_certificate_sha256}"
          if [[ "${actual_certificate_sha256}" != "${expected_certificate_sha256}" ]]; then
            echo "::error::Protected Android signing certificate does not match the pinned certificate."
            exit 1
          fi

      - name: Build the signed nightly APK
        env:
          NC_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nextcloud-native-release.keystore
          NC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          NC_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          NC_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          NIGHTLY_VERSION: ${{ needs.source.outputs.version }}
          NIGHTLY_VERSION_CODE: ${{ needs.source.outputs.version-code }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            -PncVersionName="${NIGHTLY_VERSION}" \
            -PncVersionCode="${NIGHTLY_VERSION_CODE}" \
            :androidApp:verifyReleaseLintGate \
            :androidApp:lintVitalDirectApk \
            :androidApp:assembleDirectApk

      - name: Verify signing, version identity, and manifest
        env:
          NIGHTLY_TAG: ${{ needs.source.outputs.tag }}
          NIGHTLY_VERSION: ${{ needs.source.outputs.version }}
          NIGHTLY_VERSION_CODE: ${{ needs.source.outputs.version-code }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk_name="nextcloud-native-${NIGHTLY_VERSION}-android.apk"
          cp androidApp/build/outputs/apk/directApk/androidApp-directApk.apk "dist/${apk_name}"

          apksigner_path="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          "${apksigner_path}" verify --verbose --print-certs "dist/${apk_name}" \
            >"${RUNNER_TEMP}/apk-signing.txt" 2>&1
          certificate_sha256="$(
            tools/extract-apksigner-certificate-sha256.sh \
              <"${RUNNER_TEMP}/apk-signing.txt"
          )"
          expected_certificate_sha256="$(tr -d ':[:space:]' \
            <release/android-signing-certificate.sha256 | tr '[:upper:]' '[:lower:]')"
          test "${certificate_sha256}" = "${expected_certificate_sha256}"

          apkanalyzer="${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer"
          test "$("${apkanalyzer}" manifest version-code "dist/${apk_name}")" \
            = "${NIGHTLY_VERSION_CODE}"
          test "$("${apkanalyzer}" manifest version-name "dist/${apk_name}")" \
            = "${NIGHTLY_VERSION}"

          apk_size="$(stat --format='%s' "dist/${apk_name}")"
          apk_sha256="$(sha256sum "dist/${apk_name}" | awk '{print $1}')"
          signer_digests="$(jq -cn --arg digest "${certificate_sha256}" '[$digest]')"
          tools/create-android-update-manifest.sh \
            dist/update-manifest.json \
            nightly-v1 \
            "${NIGHTLY_TAG}" \
            "${NIGHTLY_VERSION}" \
            "${NIGHTLY_VERSION_CODE}" \
            "${apk_name}" \
            "${apk_size}" \
            "${apk_sha256}" \
            "${signer_digests}"
          printf '%s\n' "${certificate_sha256}" >dist/android-certificate.sha256
          printf '%s\n' "${apk_sha256}" >dist/android-apk.sha256

      - name: Remove protected Android signing key
        if: always()
        run: |
          keystore="${RUNNER_TEMP}/nextcloud-native-release.keystore"
          if [[ -f "${keystore}" ]]; then
            shred --remove "${keystore}"
          fi

      - name: Upload verified signed nightly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nextcloud-native-android
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  desktop:
    needs: source
    if: needs.source.outputs.eligible == 'true'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            tasks: ":ui:packageDeb :ui:packageRpm"
            paths: |
              ui/build/compose/binaries/main/deb/*.deb
              ui/build/compose/binaries/main/rpm/*.rpm
          - runner: windows-latest
            platform: windows
            tasks: ":ui:packageMsi"
            paths: ui/build/compose/binaries/main/msi/*.msi
          - runner: macos-15-intel
            platform: macos
            tasks: ":ui:packageDmg"
            paths: ui/build/compose/binaries/main/dmg/*.dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build native desktop package
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon ${{ matrix.tasks }}
          status=$?
          if [[ "${status}" -ne 0 ]]; then
            find ui/build/compose/logs -type f -print -exec cat {} \; 2>/dev/null || true
          fi
          exit "${status}"

      - name: Upload desktop nightly package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nextcloud-native-${{ matrix.platform }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 7

  stage-assets:
    needs:
      - source
      - android
      - desktop
    if: >-
      always() &&
      needs.source.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      successful-platforms: ${{ steps.platforms.outputs.successful }}
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download successful nightly packages
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: nextcloud-native-*
          path: artifacts

      - name: Count successful platforms
        id: platforms
        run: |
          set -euo pipefail
          successful=0
          for platform in android linux windows macos; do
            artifact="artifacts/nextcloud-native-${platform}"
            if [[ -d "${artifact}" ]] &&
              find "${artifact}" -type f -print -quit | grep -q .; then
              successful=$((successful + 1))
              echo "${platform}: available"
            else
              echo "${platform}: unavailable"
            fi
          done
          echo "Successful platforms: ${successful}/4"
          echo "successful=${successful}" >>"${GITHUB_OUTPUT}"
          test "${successful}" -gt 0

      - name: Prepare immutable release assets
        run: |
          set -euo pipefail
          if [[ -d artifacts/nextcloud-native-android ]]; then
            test -f artifacts/nextcloud-native-android/update-manifest.json
            test -f artifacts/nextcloud-native-android/android-apk.sha256
          fi
          mkdir -p dist
          find artifacts -mindepth 2 -maxdepth 2 -type f \
            ! -name android-apk.sha256 \
            ! -name android-certificate.sha256 \
            -exec cp -t dist -- {} +
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' |
              sort -z |
              xargs -0 sha256sum >SHA256SUMS
          )

      - name: Create or verify immutable nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_SHA: ${{ needs.source.outputs.sha }}
          NIGHTLY_TAG: ${{ needs.source.outputs.tag }}
          NIGHTLY_VERSION: ${{ needs.source.outputs.version }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SUCCESSFUL_PLATFORMS: ${{ steps.platforms.outputs.successful }}
        run: |
          set -euo pipefail
          existing_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${NIGHTLY_TAG}" \
              --jq '.object.sha' 2>/dev/null || true
          )"
          if [[ -z "${existing_sha}" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${NIGHTLY_TAG}" \
              -f "sha=${NIGHTLY_SHA}" >/dev/null
          elif [[ "${existing_sha}" != "${NIGHTLY_SHA}" ]]; then
            echo "::error::Nightly tag ${NIGHTLY_TAG} points to a different commit."
            exit 1
          fi

          printf 'Automated nightly from the tested main branch.\n\nSource CI: %s\n' \
            "${SOURCE_RUN_URL}" >"${RUNNER_TEMP}/release-notes.md"
          if [[ "${SUCCESSFUL_PLATFORMS}" -lt 4 ]]; then
            {
              printf '\n## Build availability\n\n'
              printf '| Platform | Status |\n'
              printf '| --- | --- |\n'
              for platform in android linux windows macos; do
                artifact="artifacts/nextcloud-native-${platform}"
                case "${platform}" in
                  android) label="Android" ;;
                  linux) label="Linux" ;;
                  windows) label="Windows" ;;
                  macos) label="macOS" ;;
                esac
                if [[ -d "${artifact}" ]] &&
                  find "${artifact}" -type f -print -quit | grep -q .; then
                  printf '| %s | Available |\n' "${label}"
                else
                  printf '| %s | Unavailable |\n' "${label}"
                fi
              done
            } >>"${RUNNER_TEMP}/release-notes.md"
          fi
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          test "${#assets[@]}" -gt 0

          if gh release view "${NIGHTLY_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            mkdir -p "${RUNNER_TEMP}/existing"
            for asset in "${assets[@]}"; do
              name="$(basename "${asset}")"
              if gh release view "${NIGHTLY_TAG}" --repo "${GITHUB_REPOSITORY}" \
                --json assets --jq '.assets[].name' | grep -Fxq "${name}"; then
                gh release download "${NIGHTLY_TAG}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --pattern "${name}" \
                  --dir "${RUNNER_TEMP}/existing"
                cmp "${asset}" "${RUNNER_TEMP}/existing/${name}" || {
                  echo "::error::Existing nightly asset ${name} is not immutable."
                  exit 1
                }
              else
                gh release upload "${NIGHTLY_TAG}" "${asset}" \
                  --repo "${GITHUB_REPOSITORY}"
              fi
            done
            gh release edit "${NIGHTLY_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --prerelease \
              --latest=false \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --title "Nextcloud Native ${NIGHTLY_VERSION}"
          else
            gh release create "${NIGHTLY_TAG}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --prerelease \
              --latest=false \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --title "Nextcloud Native ${NIGHTLY_VERSION}"
          fi

  release-quorum:
    needs: stage-assets
    runs-on: ubuntu-latest
    steps:
      - name: Require at least three successful platforms
        env:
          SUCCESSFUL_PLATFORMS: ${{ needs.stage-assets.outputs.successful-platforms }}
        run: |
          echo "Successful platforms: ${SUCCESSFUL_PLATFORMS}/4"
          test "${SUCCESSFUL_PLATFORMS}" -ge 3

  publish:
    needs:
      - source
      - stage-assets
      - release-quorum
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the staged nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ needs.source.outputs.tag }}
        run: |
          gh release edit "${NIGHTLY_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft=false \
            --prerelease \
            --latest=false
