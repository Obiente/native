name: Refresh marketing captures

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/refresh-marketing-captures.yml"
      - "tools/marketing-capture-inputs.txt"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/gradle-wrapper.properties"
      - "ui/build.gradle.kts"
      - "ui/src/commonMain/**"
      - "ui/src/desktopMain/kotlin/dev/obiente/nextcloudnative/nativeui/preview/**"
      - "ui/src/desktopMain/resources/marketing/**"
      - "website/package.json"
      - "website/package-lock.json"
      - "website/public/demo-media/**"
      - "website/public/screenshots/**"
      - "website/scripts/marketing-captures.mjs"
      - "website/scripts/verify-marketing-captures.mjs"

permissions:
  contents: read

concurrency:
  group: marketing-captures-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh marketing captures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install capture dependencies
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2t64
          npm ci --prefix website

      - name: Regenerate captures
        run: ./gradlew --no-daemon --max-workers=1 :ui:captureMarketingScreenshots

      - name: Verify regenerated captures
        run: npm run --prefix website verify:captures:fresh

      - name: Prepare capture refresh artifact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          artifact_directory="${RUNNER_TEMP}/marketing-capture-refresh"
          mkdir -p -- "${artifact_directory}"
          capture_status="$(git status --porcelain --untracked-files=all -- website/public/screenshots)"
          outside_status="$(git status --porcelain --untracked-files=all -- . ':(exclude)website/public/screenshots/**')"
          if [[ -n "${outside_status}" ]]; then
            printf 'Capture regeneration modified files outside the screenshot directory.\n' >&2
            printf '%s\n' "${outside_status}" >&2
            exit 1
          fi
          state='current'
          if [[ -z "${capture_status}" ]]; then
            printf 'Marketing captures already match this pull request.\n'
            : >"${artifact_directory}/captures.patch"
          elif [[ "${HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" || "${HEAD_AUTHOR}" == 'dependabot[bot]' ]]; then
            printf 'Marketing captures changed, but this pull request is read-only to workflows.\n' >&2
            printf 'Run tools/capture-marketing-screenshots.sh and commit the results.\n' >&2
            exit 1
          else
            state='changed'
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            fi
            node tools/changelog-fragments.mjs check-diff \
              --base "${BASE_SHA}" \
              --head HEAD
            git add --intent-to-add --all -- website/public/screenshots
            git diff --binary --full-index -- website/public/screenshots >"${artifact_directory}/captures.patch"
            if [[ ! -s "${artifact_directory}/captures.patch" ]]; then
              printf 'Capture changes were detected but no patch was produced.\n' >&2
              exit 1
            fi
          fi
          jq -n \
            --arg state "${state}" \
            --arg repository "${HEAD_REPOSITORY}" \
            --arg headRef "${HEAD_REF}" \
            --arg headSha "${HEAD_SHA}" \
            --arg author "${HEAD_AUTHOR}" \
            --argjson pullRequest "${PULL_REQUEST_NUMBER}" \
            '{state: $state, repository: $repository, headRef: $headRef, headSha: $headSha, author: $author, pullRequest: $pullRequest}' \
            >"${artifact_directory}/metadata.json"

      - name: Upload capture refresh artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marketing-capture-refresh
          path: ${{ runner.temp }}/marketing-capture-refresh
          if-no-files-found: error
          retention-days: 1
